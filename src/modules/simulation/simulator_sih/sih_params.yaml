module_name: simulator_sih
parameters:
- group: Simulation In Hardware
  definitions:
    SIH_MASS:
      description:
        short: Vehicle mass
        long: This value can be measured by weighting the quad on a scale.
      type: float
      default: 1.0
      unit: kg
      min: 0.0
      decimal: 2
      increment: 0.1
    SIH_IXX:
      description:
        short: Vehicle inertia about X axis
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          It represents the difficulty of the vehicle to modify its angular rate.
      type: float
      default: 0.025
      unit: kg m^2
      min: 0.0
      decimal: 3
      increment: 0.005
    SIH_IYY:
      description:
        short: Vehicle inertia about Y axis
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          It represents the difficulty of the vehicle to modify its angular rate.
      type: float
      default: 0.025
      unit: kg m^2
      min: 0.0
      decimal: 3
      increment: 0.005
    SIH_IZZ:
      description:
        short: Vehicle inertia about Z axis
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          It represents the difficulty of the vehicle to modify its angular rate.
      type: float
      default: 0.03
      unit: kg m^2
      min: 0.0
      decimal: 3
      increment: 0.005
    SIH_IXY:
      description:
        short: Vehicle cross term inertia xy
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          This value can be set to 0 for a quad symmetric about its center of mass.
      type: float
      default: 0.0
      unit: kg m^2
      decimal: 3
      increment: 0.005
    SIH_IXZ:
      description:
        short: Vehicle cross term inertia xz
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          This value can be set to 0 for a quad symmetric about its center of mass.
      type: float
      default: 0.0
      unit: kg m^2
      decimal: 3
      increment: 0.005
    SIH_IYZ:
      description:
        short: Vehicle cross term inertia yz
        long: |-
          The inertia is a 3 by 3 symmetric matrix.
          This value can be set to 0 for a quad symmetric about its center of mass.
      type: float
      default: 0.0
      unit: kg m^2
      decimal: 3
      increment: 0.005
    SIH_T_MAX:
      description:
        short: Max multicopter propeller thrust force
        long: |-
          This is the maximum force delivered by one propeller
          when the motor is running at full speed.

          This value is usually about 5 times the mass of the quadrotor.

          Refer to SIH_F_T_MAX for the thrust for FW, Tailsitter, and VTOL pusher.
      type: float
      default: 5.0
      unit: N
      min: 0.0
      decimal: 2
      increment: 0.5
    SIH_Q_MAX:
      description:
        short: Max multicopter propeller torque
        long: |-
          This is the maximum torque delivered by one propeller
          when the motor is running at full speed.

          This value is usually about few percent of the maximum thrust force.

          Refer to SIH_F_Q_MAX for the propeller torque for FW, Tailsitter, and VTOL pusher.
      type: float
      default: 0.1
      unit: Nm
      min: 0.0
      decimal: 3
      increment: 0.05
    SIH_L_ROLL:
      description:
        short: Roll arm length
        long: |-
          This is the arm length generating the rolling moment

          This value can be measured with a ruler.
          This corresponds to half the distance between the left and right motors.
      type: float
      default: 0.2
      unit: m
      min: 0.0
      decimal: 2
      increment: 0.05
    SIH_L_PITCH:
      description:
        short: Pitch arm length
        long: |-
          This is the arm length generating the pitching moment

          This value can be measured with a ruler.
          This corresponds to half the distance between the front and rear motors.
      type: float
      default: 0.2
      unit: m
      min: 0.0
      decimal: 2
      increment: 0.05
    SIH_KDV:
      description:
        short: First order drag coefficient
        long: |-
          Physical coefficient representing the friction with air particules.
          The greater this value, the slower the quad will move.

          Drag force function of velocity: D=-KDV*V.
          The maximum freefall velocity can be computed as V=10*MASS/KDV [m/s]
      type: float
      default: 1.0
      unit: N/(m/s)
      min: 0.0
      decimal: 2
      increment: 0.05
    SIH_KDW:
      description:
        short: First order angular damper coefficient
        long: |-
          Physical coefficient representing the friction with air particules during rotations.
          The greater this value, the slower the quad will rotate.

          Aerodynamic moment function of body rate: Ma=-KDW*W_B.
          This value can be set to 0 if unknown.
      type: float
      default: 0.025
      unit: Nm/(rad/s)
      min: 0.0
      decimal: 3
      increment: 0.005
    SIH_LOC_LAT0:
      description:
        short: Initial geodetic latitude
        long: |-
          This value represents the North-South location on Earth where the simulation begins.

          LAT0, LON0, H0, MU_X, MU_Y, and MU_Z should ideally be consistent among each others
          to represent a physical ground location on Earth.
      type: float
      default: 47.397742
      unit: deg
      min: -90
      max: 90
    SIH_LOC_LON0:
      description:
        short: Initial geodetic longitude
        long: |-
          This value represents the East-West location on Earth where the simulation begins.

          LAT0, LON0, H0, MU_X, MU_Y, and MU_Z should ideally be consistent among each others
          to represent a physical ground location on Earth.
      type: float
      default: 8.545594
      unit: deg
      min: -180
      max: 180
    SIH_LOC_H0:
      description:
        short: Initial AMSL ground altitude
        long: |-
          This value represents the Above Mean Sea Level (AMSL) altitude where the simulation begins.

          If using FlightGear as a visual animation,
          this value can be tweaked such that the vehicle lies on the ground at takeoff.

          LAT0, LON0, H0, MU_X, MU_Y, and MU_Z should ideally be consistent among each others
          to represent a physical ground location on Earth.
      type: float
      default: 489.4
      unit: m
      min: -420.0
      max: 8848.0
      decimal: 2
      increment: 0.01
    SIH_DISTSNSR_MIN:
      description:
        short: distance sensor minimum range
      type: float
      default: 0.0
      unit: m
      min: 0.0
      max: 10.0
      decimal: 4
      increment: 0.01
    SIH_DISTSNSR_MAX:
      description:
        short: distance sensor maximum range
      type: float
      default: 100.0
      unit: m
      min: 0.0
      max: 1000.0
      decimal: 4
      increment: 0.01
    SIH_DISTSNSR_OVR:
      description:
        short: if >= 0 the distance sensor measures will be overridden by this value
        long: Absolute value superior to 10000 will disable distance sensor
      type: float
      default: -1.0
      unit: m
    SIH_DISTSNSR_DIR:
      description:
        short: Distance sensor orientations bitmask
        long: |-
          Bitmask of enabled simulated distance sensor orientations. Each set bit
          publishes an independent distance_sensor instance whose beam direction
          matches the named MAV_SENSOR_ORIENTATION_*. SIH_DISTSNSR_MIN, MAX, and
          OVR apply to every enabled instance.

          The default (bit 0 only = downward) preserves the legacy single-instance
          behavior. Forward/side/up beams are opt-in.

          Note: PX4 param names are capped at 16 characters, so this is named
          SIH_DISTSNSR_DIR rather than the spec-proposed SIH_DISTSNSR_ORIENT.
      type: bitmask
      bit:
        0: Downward (MAV_SENSOR_ROTATION_PITCH_270)
        1: Forward (MAV_SENSOR_ROTATION_NONE)
        2: Left (MAV_SENSOR_ROTATION_YAW_270)
        3: Right (MAV_SENSOR_ROTATION_YAW_90)
        4: Upward (MAV_SENSOR_ROTATION_PITCH_90)
      default: 1
      min: 0
      max: 31
    SIH_TERR_EN:
      description:
        short: Terrain mode selector (off / fBm terrain / walls / DEM map / corridor)
        long: |-
          Selects one of five mutually exclusive ground modes. Both the
          fBm terrain (mode 1) and the wall lattice (mode 2) share the
          hash primitive in lib/terrain via SIH_TERR_SEED, but only one
          materialises at a time.

            0 = off. Flat ground at z = 0. No walls. Behavior is
                byte-identical to SIH without the terrain feature.
            1 = terrain. terrain(N, E) returns fBm height driven by
                SIH_TERR_AMP (peak amplitude) and SIH_TERR_FREQ (base
                spatial frequency). No walls in the SDF scene.
            2 = walls. Flat ground at z = 0 plus a procedural wall
                lattice: cells in a fixed grid around home are
                independently hashed and each occupied cell produces a
                vertical wall whose dimensions and yaw come from the
                cell's hash. SIH_TERR_AMP is ignored in this mode.
            3 = map. Real elevation sampled from a heightmap file at
                /fs/microsd/etc/terrain.pxtm, bilinearly interpolated
                with toroidal wrap outside the patch. Build the file
                from an SRTM tile with Tools/simulation/sih/
                dem_to_pxtm.py. If the file is missing or malformed the
                ground stays flat and the reason is logged at boot.
                SIH_TERR_AMP is ignored in this mode.
            4 = corridor. Solid wall boxes arranged so the clear space
                between them reads as rooms and corridors. Walls are
                ordinary SDF primitives, so they compose with the ground
                by min()-union rather than replacing it, and the vehicle
                can fly out through a doorway and land on open ground.
                Rays intersect them exactly instead of sphere-marching,
                so a corridor costs the same per ray as open air. The
                layout is the hand-built corridor in corridor_demo.cpp:
                90 m by 24 m clear, walls 8 m tall, split into three bays
                by cross walls carrying centred 8 m doorways.
                SIH_TERR_AMP and the wall lattice are both ignored.

          The active mode is visible to the obstacle ring (SIH_OBST_EN)
          and to the forward/side/up distance sensors (SIH_DISTSNSR_DIR)
          via the same SDF sphere tracer.

          SIH_TERR_PLANE is honoured independently of this selector: a
          non-zero slope angle engages planar mode regardless of the
          ground mode.
      type: int32
      default: 0
      min: 0
      max: 4
      values:
        0: Off (flat ground)
        1: Terrain (fBm hills)
        2: Walls (flat ground + wall lattice)
        3: Map (real elevation from SD card)
        4: Corridor (hand-built walls forming rooms)
    SIH_TERR_AMP:
      description:
        short: Terrain peak-to-peak amplitude
        long: |-
          Vertical amplitude of the procedural terrain. 0 reproduces a flat
          surface even when SIH_TERR_EN is on (useful for differential
          regression tests).
      type: float
      default: 0.0
      unit: m
      min: 0.0
      max: 2000.0
      decimal: 2
      increment: 1.0
    SIH_TERR_FREQ:
      description:
        short: Terrain base spatial frequency (1/m)
      type: float
      default: 0.005
      min: 0.0001
      max: 0.1
      decimal: 4
      increment: 0.0005
    SIH_TERR_SEED:
      description:
        short: Terrain hash seed (same seed -> same world)
      type: int32
      default: 0
    SIH_TERR_PLANE:
      description:
        short: Deterministic planar-terrain slope (deg)
        long: |-
          Selects between procedural fBm terrain (default) and a deterministic
          uniform-slope half-plane.

          When 0, terrain remains the procedural fBm field driven by
          SIH_TERR_AMP / FREQ / SEED (and the wall lattice is materialised
          independently if SIH_TERR_EN is on).

          When non-zero, terrain becomes a planar half-space tilted toward
          the +N axis at the given angle:
              terrain(N, E)          =  tan(angle) * N
              terrain_gradient(N, E) =  (tan(angle), 0)
          terrain(0, 0) = 0 is preserved by construction so the vehicle
          still spawns at the home reference altitude. Heading is fixed at
          +N for now (heading is a future-extension knob).

          Honoured independently of SIH_TERR_EN — planar slope and the
          wall lattice are orthogonal features. Intended for acceptance
          tests that need a uniform slope across the landing-gear footprint
          (the sloped-tip acceptance test).
      type: float
      default: 0.0
      unit: deg
      min: -89.0
      max: 89.0
      decimal: 1
      increment: 1.0
    # Obstacle ring
    SIH_OBST_EN:
      description:
        short: Obstacle ring master enable
        long: |-
          When enabled, the SIH module publishes the obstacle_distance uORB
          topic at 10 Hz, populated by raycasting a 72-bin horizontal ring
          (5 deg spacing) in the vehicle body frame against the procedural
          terrain. 36 bins are refreshed per cycle so the full ring updates
          every 0.2 s, mimicking a 5 Hz spinning lidar.

          The published topic feeds the MAVLink OBSTACLE_DISTANCE stream and
          the collision_prevention library. When disabled (default), no
          obstacle_distance message is published and behavior is
          byte-identical to SIH without the obstacle ring.
      type: boolean
      default: 0
    SIH_OBST_MAX:
      description:
        short: Obstacle ring max raycast range
        long: |-
          Maximum range, in metres, used when raycasting each bin of the
          obstacle ring. A bin that does not intersect the terrain within
          this range publishes the no-obstacle marker (max_distance + 1)
          so consumers such as collision_prevention can distinguish
          "clear" from "saturated" returns.

          Larger values widen the look-ahead at modest CPU cost (one extra
          raycast step per bin per cycle); smaller values keep the ring
          local to the vehicle.
      type: float
      default: 50.0
      unit: m
      min: 1.0
      max: 200.0
      decimal: 1
      increment: 1.0
    # Ground contact (slope dynamics)
    SIH_GROUND_K:
      description:
        short: Ground contact normal stiffness (N/m, per gear)
      type: float
      default: 1000.0
      min: 100.0
      max: 1000000.0
      decimal: 0
      increment: 100.0
    SIH_GROUND_C:
      description:
        short: Ground contact normal damping (per gear, set to ~2*sqrt(K*M/4))
      type: float
      default: 32.0
      unit: N/(m/s)
      min: 0.0
      max: 10000.0
      decimal: 0
      increment: 1.0
    SIH_GROUND_MU:
      description:
        short: Ground contact Coulomb friction coefficient
        long: |-
          Dimensionless Coulomb friction coefficient applied in the
          tangent plane at each gear contact point. The tangential
          friction force is capped at mu * |F_normal_gear|; below that
          cap the contact is static (gear does not slide), above it
          dynamic friction opposes the local tangential velocity.

          Typical values: 0.3 ≈ rubber on wet asphalt, 0.5 ≈ rubber on
          grass (default), 1.0+ ≈ rubber on dry rubber. Set to 0 to
          disable friction (pure normal contact, vehicle slides freely
          on slopes).
      type: float
      default: 0.5
      min: 0.0
      max: 2.0
      decimal: 2
      increment: 0.05
    SIH_GEAR_Z:
      description:
        short: Landing-gear vertical offset below CoM (m); 0 disables contact torque
      type: float
      default: 0.10
      unit: m
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.05
    SIH_T_TAU:
      description:
        short: thruster time constant tau
        long: the time taken for the thruster to step from 0 to 100% should be about
          4 times tau
      type: float
      default: 0.05
      unit: s
    SIH_VEHICLE_TYPE:
      description:
        short: Vehicle type
      type: enum
      values:
        0: Quadcopter
        1: Fixed-Wing
        2: Tailsitter
        3: Standard VTOL
        4: Hexacopter
        5: Rover Ackermann
      default: 0
      reboot_required: true
    SIH_WIND_N:
      description:
        short: Wind velocity from north direction
      type: float
      default: 0.0
      unit: m/s
    SIH_WIND_E:
      description:
        short: Wind velocity from east direction
      type: float
      default: 0.0
      unit: m/s
    SIH_RNGBC_NOISE:
      description:
        short: Ranging beacon measurement noise standard deviation
        long: Gaussian noise added to simulated ranging beacon measurements. Set to 0 to disable noise.
      type: float
      default: 30.0
      unit: m
      min: 0.0
      max: 100.0
      decimal: 1
    SIH_F_T_MAX:
      description:
        short: Forward thruster max thrust (N)
        long: |-
          This is used for the Fixed-Wing, Tailsitter, or pusher of the Standard VTOL
          if SIH_F_CT0 <= 0.
          If SIH_F_CT0 > 0, propeller model with advance ratio J is used
          and this parameter value is overridden at simulation startup.
      type: float
      default: 2.0
      unit: N
      min: 0.0
      decimal: 3
    SIH_F_Q_MAX:
      description:
        short: Forward thruster max torque (Nm)
        long: |-
          This is used for the Fixed-Wing, Tailsitter, or pusher of the Standard VTOL
          if SIH_F_CP0 <= 0.
          If SIH_F_CP0 > 0, propeller model with advance ratio J is used
          and this parameter value is overridden at simulation startup.
      type: float
      default: 0.0165
      unit: Nm
      min: 0.0
      decimal: 3
    SIH_F_CT0:
      description:
        short: Forward thruster static thrust coefficient
      type: float
      default: 0.0
      min: 0.0
      decimal: 3
    SIH_F_CT1:
      description:
        short: Forward thruster thrust coefficient 1
        long: CT(J) = CT0 + CT1*J + CT2*J^2
      type: float
      default: 0.0
      decimal: 3
    SIH_F_CT2:
      description:
        short: Forward thruster thrust coefficient 2
        long: CT(J) = CT0 + CT1*J + CT2*J^2
      type: float
      default: 0.0
      max: 0.0
      decimal: 3
    SIH_F_CP0:
      description:
        short: Forward thruster static power coefficient
      type: float
      default: 0.0
      min: 0.0
      decimal: 3
    SIH_F_CP1:
      description:
        short: Forward thruster power coefficient 1
        long: CP(J) = CP0 + CP1*J + CP2*J^2
      type: float
      default: 0.0
      decimal: 3
    SIH_F_CP2:
      description:
        short: Forward thruster power coefficient 2
        long: CP(J) = CP0 + CP1*J + CP2*J^2
      type: float
      default: 0.0
      max: 0.0
      decimal: 3
    SIH_F_DIA_INCH:
      description:
        short: Forward thruster propeller diameter in inches
      type: float
      default: 0.1
      min: 0.1
      decimal: 1
    SIH_F_RPM_MAX:
      description:
        short: Forward thruster max RPM
      type: float
      default: 6000.0
      min: 0.1
      decimal: 1
